# This workflow updates the code line count badge displayed in the README file.
# The badge lives on the badges branch; this workflow only rewrites the count in it.

name: Badges

on:
  push:
    branches:
      - main

jobs:
  badges:
    name: Update badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: badges
          path: badges
      - run: node .github/scripts/update-badges.mjs badges
      - name: Commit the badges
        working-directory: badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || { git commit -am "Update the code line count badge."; git push; }
