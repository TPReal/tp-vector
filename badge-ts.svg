<svg xmlns="http://www.w3.org/2000/svg" width="124" height="20" role="img"
     font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle">
  <title>Lines of code</title>
  <linearGradient id="shine" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="round"><rect width="100%" height="100%" rx="3"/></clipPath>
  <g clip-path="url(#round)">
    <svg width="69" height="100%">
      <rect width="100%" height="100%" fill="#555"/>
      <rect width="100%" height="100%" fill="url(#shine)"/>
      <text x="50%" y="15" fill="#010101" fill-opacity=".3">TypeScript</text>
      <text x="50%" y="14" fill="#fff">TypeScript</text>
    </svg>
    <!-- The count box is wide enough for six digits. -->
    <svg x="69" width="55" height="100%">
      <rect width="100%" height="100%" fill="#3178c6"/>
      <rect width="100%" height="100%" fill="url(#shine)"/>
      <text x="50%" y="15" fill="#010101" fill-opacity=".3">
        <!-- LINE_COUNT_HERE -->12&#8201;591
      </text>
      <text x="50%" y="14" fill="#fff">
        <!-- LINE_COUNT_HERE -->12&#8201;591
      </text>
    </svg>
  </g>
</svg>
